<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Верхняя огибающая выигрышей Боба</title>
  <desc id="desc">Три прямые выигрыша Боба для действий R, M и L. Лучшая стратегия меняется при вероятности U равной одной трети и одной второй.</desc>
  <rect width="1200" height="720" rx="24" fill="#f8fafc"/>
  <text x="70" y="65" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#14243c">Лучший ответ Боба в игре 2 × 3</text>
  <text x="70" y="105" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#475569">x — вероятность, с которой Алиса играет U</text>
  <rect x="160" y="160" width="280" height="465" fill="#fef2f2"/>
  <rect x="440" y="160" width="140" height="465" fill="#eff6ff"/>
  <rect x="580" y="160" width="420" height="465" fill="#f0fdf4"/>
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="160" y1="500" x2="1000" y2="500"/>
    <line x1="160" y1="425" x2="1000" y2="425"/>
    <line x1="160" y1="350" x2="1000" y2="350"/>
    <line x1="160" y1="275" x2="1000" y2="275"/>
    <line x1="160" y1="200" x2="1000" y2="200"/>
  </g>
  <g stroke="#334155" stroke-width="3">
    <line x1="160" y1="625" x2="1025" y2="625"/>
    <line x1="160" y1="625" x2="160" y2="145"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">
    <text x="129" y="506">2</text><text x="129" y="431">3</text><text x="129" y="356">4</text><text x="129" y="281">5</text><text x="129" y="206">6</text>
    <text x="154" y="657">0</text><text x="424" y="657">⅓</text><text x="567" y="657">½</text><text x="992" y="657">1</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8">
    <line x1="440" y1="160" x2="440" y2="625"/>
    <line x1="580" y1="160" x2="580" y2="625"/>
  </g>
  <g fill="none" stroke-width="3" opacity=".52">
    <path d="M160 500 L1000 200" stroke="#15803d"/>
    <path d="M160 425 L1000 275" stroke="#2563eb"/>
    <path d="M160 275 L1000 575" stroke="#dc2626"/>
  </g>
  <path d="M160 275 L440 375" stroke="#dc2626" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M440 375 L580 350" stroke="#2563eb" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M580 350 L1000 200" stroke="#15803d" stroke-width="9" fill="none" stroke-linecap="round"/>
  <circle cx="440" cy="375" r="9" fill="#0f172a"/><circle cx="580" cy="350" r="9" fill="#0f172a"/>
  <g font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">
    <text x="265" y="207" fill="#b91c1c">R</text><text x="480" y="207" fill="#1d4ed8">M</text><text x="770" y="207" fill="#15803d">L</text>
  </g>
  <text x="1025" y="633" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#334155">x</text>
  <text x="45" y="154" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#334155">выигрыш</text>
  <g font-family="Arial,Helvetica,sans-serif" fill="#334155">
    <text x="160" y="693" font-size="21">v</text><text x="172" y="704" font-size="15">R</text><text x="185" y="693" font-size="21">(x) = 5 − 4x</text>
    <text x="480" y="693" font-size="21">v</text><text x="492" y="704" font-size="15">M</text><text x="508" y="693" font-size="21">(x) = 3 + 2x</text>
    <text x="800" y="693" font-size="21">v</text><text x="812" y="704" font-size="15">L</text><text x="825" y="693" font-size="21">(x) = 2 + 4x</text>
  </g>
</svg>
